<style>
/* SalonFlow Design System: Completely Image-Free & Emoji-Free */
:root {
  --bg: #000000;
  --card: #0d0d10;
  --card-hover: #15151a;
  --card-elevated: #1a1a22;
  --line: rgba(255, 255, 255, 0.12);
  --line-strong: rgba(255, 255, 255, 0.24);
  --text: #ffffff;
  --mute: #9e9ea6;
  --low: #10b981;
  --mid: #f59e0b;
  --high: #ef4444;
  --accent: #818cf8;
  --holo: linear-gradient(135deg, #c7d2fe 0%, #f472b6 40%, #fbbf24 75%, #34d399 100%);
  --gold-foil: linear-gradient(135deg, #d4af37, #fff8dc, #aa771c);
  --leather: linear-gradient(145deg, #181210 0%, #2b1d19 50%, #150f0d 100%);
  --leather-pocket: linear-gradient(180deg, #221714 0%, #150e0c 100%);
  --tab-bar-h: 58px;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

*,
*::before,
*::after {
  box-sizing: inherit;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "SF Pro Display", Inter, system-ui, sans-serif;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 140px;
}

.holo {
  background: var(--holo);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.num {
  font-variant-numeric: tabular-nums;
}

.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 28px;
}

/* Sticky Header with Generous Spacing */
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--line);
}

header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
  gap: 20px;
  padding: 0 28px;
}

/* SF Monogram Logo */
.logo {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  text-decoration: none;
  user-select: none;
  flex-shrink: 0;
}

.sf-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--holo);
  color: #050507;
  font-family: Archivo, "Inter Tight", sans-serif;
  font-weight: 900;
  font-style: italic;
  font-size: 22px;
  letter-spacing: -0.07em;
  line-height: 1;
  box-shadow: 0 4px 16px rgba(244, 114, 182, 0.35);
  padding-right: 1px;
}

.sf-text {
  font-family: Archivo, "Inter Tight", sans-serif;
  font-style: italic;
  font-weight: 900;
  font-stretch: 125%;
  font-size: 23px;
  letter-spacing: -0.04em;
  color: var(--text);
}

nav.top {
  display: none;
  gap: 8px;
  align-items: center;
}

nav a,
.tabs a {
  color: var(--mute);
  text-decoration: none;
  font-weight: 500;
  font-size: 14px;
  padding: 8px 14px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

nav a:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}

nav a.on,
.tabs a.on {
  color: #fff;
  background: rgba(255, 255, 255, 0.12);
  font-weight: 600;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

/* Language Switcher */
.lang-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 999px;
  padding: 7px 14px;
  font: 600 13px Inter, sans-serif;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s ease;
}

.lang-btn:hover {
  background: rgba(255, 255, 255, 0.16);
}

/* Buttons */
.btn {
  background: #151518;
  color: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 18px;
  font: 600 14px Inter, sans-serif;
  cursor: pointer;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: all 0.15s ease;
  text-decoration: none;
}

.btn:hover {
  background: #1f1f26;
  border-color: rgba(255, 255, 255, 0.28);
}

.btn.main {
  background: #fff;
  color: #000;
  border-color: #fff;
  font-weight: 700;
}

.btn.main:hover {
  background: #e5e5ea;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 13px;
  min-height: 32px;
  border-radius: 9px;
}

.btn-danger {
  color: var(--high);
  border-color: rgba(239, 68, 68, 0.35);
}

.btn-danger:hover {
  background: rgba(239, 68, 68, 0.14);
  border-color: var(--high);
}

.btn:focus-visible,
a:focus-visible,
.card:focus-visible,
.chip:focus-visible {
  outline: 2px solid #c7d2fe;
  outline-offset: 2px;
}

/* Role Switcher Pill */
.role-badge {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(129, 140, 248, 0.18);
  color: var(--accent);
  border: 1px solid rgba(129, 140, 248, 0.35);
}

/* Departure Alert Banner */
.alert-banner {
  background: linear-gradient(90deg, rgba(244, 114, 182, 0.16), rgba(129, 140, 248, 0.16));
  border: 1px solid rgba(244, 114, 182, 0.4);
  border-radius: 18px;
  padding: 14px 20px;
  margin: 18px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  animation: pulse-glow 2s infinite alternate;
}

@keyframes pulse-glow {
  from {
    border-color: rgba(244, 114, 182, 0.35);
    box-shadow: 0 0 12px rgba(244, 114, 182, 0.15);
  }

  to {
    border-color: rgba(129, 140, 248, 0.7);
    box-shadow: 0 0 20px rgba(129, 140, 248, 0.3);
  }
}

.alert-banner-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.alert-icon-svg {
  width: 24px;
  height: 24px;
  stroke: #f472b6;
  fill: none;
  stroke-width: 2;
  flex-shrink: 0;
}

.alert-banner-text b {
  display: block;
  font-size: 15px;
  margin-bottom: 2px;
}

.alert-banner-text span {
  font-size: 13px;
  color: var(--mute);
}

/* Hero Section (No Images, Pure Radial Background) */
.hero {
  margin: 24px 0 28px;
  border-radius: 28px;
  padding: 48px 32px;
  color: #000;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 0% 0%, rgba(244, 114, 182, 0.6), transparent 45%),
    radial-gradient(circle at 100% 20%, rgba(125, 211, 252, 0.65), transparent 45%),
    radial-gradient(circle at 60% 110%, rgba(251, 191, 36, 0.55), transparent 50%),
    #f2f2f4;
}

.hero h1 {
  font-size: clamp(38px, 8.5vw, 76px);
  line-height: 0.95;
  letter-spacing: -0.06em;
  font-weight: 800;
  margin: 0 0 14px;
  font-family: "Inter Tight", Inter, sans-serif;
}

.hero h1 em {
  font-family: "Instrument Serif", Georgia, serif;
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.03em;
}

.hero p {
  margin: 0;
  font-size: 17px;
  max-width: 520px;
  color: #222;
  line-height: 1.45;
}

.hero::after {
  content: "";
  position: absolute;
  inset: -60%;
  background: conic-gradient(from 0deg, transparent 0, rgba(255, 255, 255, 0.65) 12%, transparent 30%);
  mix-blend-mode: soft-light;
  animation: spin 16s linear infinite;
  pointer-events: none;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.hero>* {
  position: relative;
  z-index: 2;
}

/* Improved Search Bar */
.search-container {
  margin-top: 24px;
  max-width: 640px;
}

.search-bar-wrap {
  position: relative;
  display: flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(0, 0, 0, 0.16);
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  transition: all 0.2s ease;
}

.search-bar-wrap:focus-within {
  background: #fff;
  border-color: #6366f1;
  box-shadow: 0 8px 32px rgba(99, 102, 241, 0.28);
}

.search-icon {
  margin-left: 16px;
  width: 20px;
  height: 20px;
  stroke: #555;
  fill: none;
  stroke-width: 2.2;
  flex-shrink: 0;
}

.search-bar-wrap input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  padding: 16px 14px;
  font: 500 16px Inter, sans-serif;
  color: #000;
  outline: none;
}

.search-bar-wrap input::placeholder {
  color: #6b7280;
}

.search-clear {
  background: rgba(0, 0, 0, 0.08);
  border: 0;
  color: #333;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  margin-right: 12px;
  transition: all 0.15s ease;
}

.search-clear:hover {
  background: rgba(0, 0, 0, 0.18);
}

.search-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 13px;
  color: #444;
  padding: 0 4px;
}

/* Stats Row */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 26px;
}

.stat-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  text-align: center;
}

.sn {
  font-size: clamp(26px, 5vw, 44px);
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 1;
  font-family: "Inter Tight", Inter, sans-serif;
}

.stat-box .sub {
  margin-top: 6px;
  font-size: 13px;
}

/* Filter Chips (Emoji Free) */
.chips-group {
  margin-bottom: 14px;
}

.chips-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--mute);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: none;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chip {
  background: var(--card);
  color: var(--mute);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 16px;
  font: 500 13px Inter, sans-serif;
  cursor: pointer;
  white-space: nowrap;
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}

.chip:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.3);
}

.chip.on {
  color: #000;
  background: #fff;
  border-color: #fff;
  font-weight: 700;
}

/* Grid Layout */
.layout {
  display: grid;
  gap: 24px;
}

.grid {
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr;
}

/* Salon Cards with Photography Cover */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: all 0.2s ease;
}

.card:hover {
  border-color: rgba(255, 255, 255, 0.35);
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
}

.card-ph {
  height: 160px;
  position: relative;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 14px 18px;
  border-radius: 22px 22px 0 0;
  overflow: hidden;
}

.card-ph::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.78) 100%);
  pointer-events: none;
}

.card-ph>* {
  position: relative;
  z-index: 2;
}

.card-area-badge {
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(8px);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.card-monogram {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: -0.02em;
}

/* 5-Photo Interactive Gallery in Salon Detail */
.gal {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(2, 100px);
  gap: 8px;
  margin-bottom: 24px;
  position: relative;
}

.gt {
  border: 0;
  border-radius: 16px;
  background: var(--card);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  padding: 0;
  transition: transform 0.2s, filter 0.2s;
}

.gt:hover {
  transform: scale(0.98);
  filter: brightness(1.1);
}

.gt img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

.g0 {
  grid-column: span 2;
  grid-row: span 2;
}

.gc {
  position: absolute;
  right: 10px;
  bottom: -20px;
  font-size: 11px;
  color: var(--mute);
}

@media(min-width: 640px) {
  .gal {
    grid-template-rows: repeat(2, 130px);
  }
}

@media(min-width: 1024px) {
  .gal {
    grid-template-rows: repeat(2, 150px);
  }
}

/* Lightbox Modal */
.lb {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.94);
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.lbi {
  width: min(92vw, 920px);
  aspect-ratio: 4/3;
  border-radius: 24px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}

.lbi img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.lbx,
.lbn {
  position: absolute;
  background: rgba(255, 255, 255, 0.16);
  border: 0;
  color: #fff;
  font-size: 28px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lbx {
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: 16px;
}

.lbn.l {
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
}

.lbn.r {
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
}

.lbc {
  position: absolute;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: 0;
  right: 0;
  text-align: center;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  background: rgba(0, 0, 0, 0.6);
  padding: 8px 16px;
  width: fit-content;
  margin: 0 auto;
  border-radius: 999px;
  backdrop-filter: blur(6px);
}

.fav-btn {
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  transition: all 0.15s ease;
}

.fav-btn:hover {
  transform: scale(1.1);
  background: rgba(0, 0, 0, 0.85);
}

.fav-btn.active {
  color: #f43f5e;
  border-color: rgba(244, 63, 94, 0.6);
}

.cb {
  padding: 18px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 10px;
}

.cb h3 {
  margin: 0 0 4px;
  font-size: 19px;
  letter-spacing: -0.03em;
  font-family: "Inter Tight", Inter, sans-serif;
  font-weight: 700;
}

.wait {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 1;
  text-align: right;
  font-family: "Inter Tight", Inter, sans-serif;
}

.wait small {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--mute);
  letter-spacing: 0;
  margin-top: 4px;
}

/* Crowd Badges & Vector Status Dots */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c);
}

.live .dot {
  animation: pulse 1.6s infinite;
}

@keyframes pulse {
  50% {
    opacity: 0.35;
  }
}

.meter {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}

.meter i {
  flex: 1;
  height: 4px;
  border-radius: 9px;
  background: #1f1f22;
}

.meter i.f {
  background: var(--c);
}

/* Map Widget */
.map {
  display: block !important;
  border: 1px solid var(--line);

/* ==============================================================
   3D FLIPPABLE PREMIUM CUSTOMER TOKEN CARD
   ============================================================== */
.token-card-3d-wrap {
  perspective: 1200px;
  -webkit-perspective: 1200px;
  width: 100%;
  max-width: 440px;
  margin: 20px auto;
}

.token-card-3d {
  width: 100%;
  min-height: 270px;
  position: relative;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 24px;
  cursor: pointer;
  user-select: none;
}

.token-card-3d.flipped {
  transform: rotateY(180deg);
  -webkit-transform: rotateY(180deg);
}

.token-card-face {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.18);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Front Face */
.token-card-front {
  background: linear-gradient(145deg, #16161b 0%, #0a0a0d 100%);
  border: 1px solid rgba(244, 114, 182, 0.35);
  position: relative;
  transform: rotateY(0deg);
  -webkit-transform: rotateY(0deg);
  z-index: 2;
  transition: opacity 0.2s ease;
}

.token-card-front::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle at top right, rgba(244, 114, 182, 0.2), transparent 70%);
  border-radius: 0 24px 0 0;
  pointer-events: none;
}

.card-top-edge {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-sf-mark {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: var(--holo);
  color: #000;
  font: 900 italic 18px Archivo, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.card-brand-name {
  font: 900 italic 19px Archivo, sans-serif;
  letter-spacing: -0.04em;
  color: #fff;
}

.card-token-pill {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.card-mid {
  margin: 18px 0;
}

.card-salon-name {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}

.card-salon-sub {
  font-size: 13px;
  color: var(--mute);
}

.card-services-list {
  font-size: 13px;
  margin-top: 8px;
  color: #e5e5ea;
  font-weight: 500;
}

.card-bottom-edge {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 12px;
}

.card-flip-prompt {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* Back Face (Flip) */
.token-card-back {
  background: #ffffff;
  color: #000000;
  transform: rotateY(180deg);
  -webkit-transform: rotateY(180deg);
  border: 1px solid #d1d5db;
  text-align: center;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1;
  transition: opacity 0.2s ease;
}

.token-card-3d.flipped .token-card-front {
  pointer-events: none;
  opacity: 0;
}

.token-card-3d.flipped .token-card-back {
  pointer-events: auto;
  opacity: 1;
  z-index: 5;
}

.token-card-3d:not(.flipped) .token-card-back {
  pointer-events: none;
  opacity: 0;
}

.token-card-3d:not(.flipped) .token-card-front {
  pointer-events: auto;
  opacity: 1;
  z-index: 5;
}

.qr-container {
  background: #fff;
  padding: 10px;
  border-radius: 12px;
  display: inline-block;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
}

.qr-container svg {
  display: block;
}

.card-scan-hint {
  font-size: 12px;
  font-weight: 700;
  color: #111;
  margin-top: 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ==============================================================
   REALISTIC LEATHER WALLET PAGE
   ============================================================== */
.leather-wallet {
  background: var(--leather);
  border-radius: 28px;
  border: 1px solid #3d2822;

/* Stitched Seam Effect */

}

.wallet-header {

}

.wallet-title {

/* ==============================================================

   ============================================================== */

/* Bottom Tabs (Wallet, Profile, Salons, Token, DBMS) */
.tabs {

  left: 0;
  right: 0;
  bottom: 0;

  justify-content: space-around;

.tabs a {
  display: flex;
  flex-direction: column;

  gap: 2px;

  justify-content: center;

.tabs svg {

  fill: none;
  stroke-width: 1.8;
}

.fl {

.in {

.av {

  color: #000;
}

.auth a.lr {
  display: flex;
  justify-content: space-between;
  padding: 16px 4px;
  border-top: 1px solid var(--line);
  text-decoration: none;
  font-weight: 500;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 12px 20px;
  border-radius: 14px;
  font: 600 14px Inter, sans-serif;
  z-index: 80;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  transition: opacity 0.3s ease;
}

.toast.fade-out {
  opacity: 0;
}

// SQL Parser & Execution Engine
function executeSQL(query) {
  var startTime = performance.now();
  var q = query.trim().replace(/;$/, "");
  
  if (!/^SELECT/i.test(q)) {
    return { error: "Only SELECT queries are supported in live evaluation mode." };
  }

  try {
    var fromMatch = q.match(/FROM\s+([a-zA-Z_]+)/i);
    if (!fromMatch) return { error: "Syntax Error: Missing FROM table." };
    
    var tableName = fromMatch[1].toLowerCase();
    var table = RELATIONAL_DB[tableName];
    if (!table) return { error: "Table '" + tableName + "' not found. Available tables: " + Object.keys(RELATIONAL_DB).join(", ") };

    var rows = JSON.parse(JSON.stringify(table));

    // Simple JOIN support (e.g. JOIN services ON ...)
    var joinMatch = q.match(/JOIN\s+([a-zA-Z_]+)\s+ON\s+([a-zA-Z0-9_\.]+)\s*=\s*([a-zA-Z0-9_\.]+)/i);
    if (joinMatch) {
      var joinTable = RELATIONAL_DB[joinMatch[1].toLowerCase()];
      if (joinTable) {
        var key1 = joinMatch[2].split(".")[1] || joinMatch[2];
        var key2 = joinMatch[3].split(".")[1] || joinMatch[3];
        var joined = [];
        rows.forEach(function(r) {
          joinTable.forEach(function(jr) {
            if (r[key1] != null && jr[key2] != null && String(r[key1]) === String(jr[key2])) {
              joined.push(Object.assign({}, r, jr));
            }
          });
        });
        if (joined.length) rows = joined;
      }
    }

    // WHERE clause
    var whereMatch = q.match(/WHERE\s+(.+?)(?:\s+GROUP\s+BY|\s+ORDER\s+BY|\s+LIMIT|$)/i);
    if (whereMatch) {
      var cond = whereMatch[1].trim();
      var colEq = cond.match(/([a-zA-Z_]+)\s*=\s*'([^']+)'/);
      if (colEq) {
        rows = rows.filter(function(r) { return String(r[colEq[1]]) === colEq[2]; });
      }
      var colEqNum = cond.match(/([a-zA-Z_]+)\s*=\s*([0-9]+)/);
      if (colEqNum) {
        rows = rows.filter(function(r) { return Number(r[colEqNum[1]]) === Number(colEqNum[2]); });
      }
    }

    // GROUP BY clause
    var groupMatch = q.match(/GROUP\s+BY\s+([a-zA-Z_]+)/i);
    if (groupMatch) {
      var groupCol = groupMatch[1];
      var groups = {};
      rows.forEach(function(r) {
        var key = r[groupCol] != null ? r[groupCol] : "NULL";
        groups[key] = groups[key] || [];
        groups[key].push(r);
      });

      var aggregated = [];
      Object.keys(groups).forEach(function(gKey) {
        var gRows = groups[gKey];
        var res = {};
        res[groupCol] = gKey;
        res["count"] = gRows.length;
        if (gRows[0].price != null) {
          res["total_revenue"] = gRows.reduce(function(a, b) { return a + (b.price || 0); }, 0);
        }
        if (gRows[0].wait_min != null) {
          res["avg_wait"] = +(gRows.reduce(function(a, b) { return a + (b.wait_min || 0); }, 0) / gRows.length).toFixed(1);
        }
        aggregated.push(res);
      });
      rows = aggregated;
    }

    // LIMIT
    var limitMatch = q.match(/LIMIT\s+([0-9]+)/i);
    if (limitMatch) {
      rows = rows.slice(0, parseInt(limitMatch[1], 10));
    }

    var elapsed = (performance.now() - startTime).toFixed(2);
    return {
      success: true,
      columns: rows.length ? Object.keys(rows[0]) : [],
      data: rows,
      rowCount: rows.length,
      timeMs: elapsed
    };
  } catch (err) {
    return { error: "Query Execution Error: " + err.message };
  }
}

    if (confirm("Reset demo data, clear token and refresh queue?")) {
      localStorage.removeItem(K.t);
      localStorage.removeItem(K.f);
      localStorage.removeItem(K.w);
      toast("Demo data reset");
      location.hash = "home";
      route();
    }
  }
  else if (a === "remfav") {
    toggleFav(b.dataset.id);
    if (location.hash === "#settings") setView();
  }
  else if (a === "star") {
    RS = +b.dataset.n;
    document.querySelectorAll(".st").forEach(function(x) {
      var n = +x.dataset.n;
      x.classList.toggle("main", n <= RS);
    });
  }
  else if (a === "rvsub") {
    var tx = gv("rt");
    if (!u) return goLogin("Log in to review");
    if (!RS) return toast("Select a star rating");
    if (tx.length < 6) return toast("Please write at least 6 characters");
    var rs = ld(K.r, []);
    rs.push({ sid: +b.dataset.sid, uid: u.id, name: u.name, st: RS, tx: tx, ts: Date.now() });
    sv(K.r, rs);
    toast("Review posted");
    detail(sid);
  }
  else if (a === "rvdel") {
    sv(K.r, ld(K.r, []).filter(function(r) { return !(r.ts == b.dataset.ts && u && r.uid === u.id); }));
    detail(sid);
  }
  else if (a === "rvlogin") {
    goLogin("Log in to write a review");
  }
});

<script>

// Crowd Labeling
function crowd(w) {
  if (w <= 15) return [t("lowCrowdLabel"), "var(--low)", "low"];
  if (w <= 35) return [t("medCrowdLabel"), "var(--mid)", "mid"];
  return [t("highCrowdLabel"), "var(--high)", "high"];
}

function badge(w) {
  var c = crowd(w);
  var n = Math.min(5, Math.max(1, Math.ceil(w / 8)));
  var m = "";
  for (var i = 0; i < 5; i++) {
    m += '<i' + (i < n ? ' class="f"' : '') + '></i>';
  }
  return '<span class="badge live" style="--c:' + c[1] + '"><i class="dot"></i>' + c[0] + '</span><div class="meter" style="--c:' + c[1] + '">' + m + '</div>';
}

// Generate SVG QR Code for Check-in
function renderQRCodeSVG(dataStr) {
  var hash = 0;
  for (var i = 0; i < dataStr.length; i++) {
    hash = ((hash << 5) - hash) + dataStr.charCodeAt(i);
    hash |= 0;
  }
  var size = 21;
  var cellSize = 7;
  var svgSize = size * cellSize;
  var rects = '';

  for (var r = 0; r < size; r++) {
    for (var c = 0; c < size; c++) {
      var isCorner = (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
      var isCornerBorder = isCorner && (r === 0 || r === 6 || c === 0 || c === 6 ||
        r === size - 7 || r === size - 1 || c === size - 7 || c === size - 1 ||
        (r >= 2 && r <= 4 && c >= 2 && c <= 4) ||
        (r >= 2 && r <= 4 && c >= size - 5 && c <= size - 3) ||
        (r >= size - 5 && r <= size - 3 && c >= 2 && c <= 4));
      var isBit = isCorner ? isCornerBorder : (((hash ^ (r * 13 + c * 37)) & 1) === 0);
      if (isBit) {
        rects += '<rect x="' + (c * cellSize) + '" y="' + (r * cellSize) + '" width="' + cellSize + '" height="' + cellSize + '" fill="#000"/>';
      }
    }
  }
  return '<svg width="' + svgSize + '" height="' + svgSize + '" viewBox="0 0 ' + svgSize + ' ' + svgSize + '">' + rects + '</svg>';
}

// Departure Alert Banner (2 Turns Away)

        '<div class="alert-banner-text">' +

          '<span>' + esc(token.salon) + ' &middot; ~' + token.eta + ' ' + t("minWait") + ' &middot; ' + (token.pos === 1 ? (currentLang === "te" ? "చెక్-ఇన్ గడువు 10 నిమిషాలు" : "10-minute check-in grace period active") : (currentLang === "te" ? "సెలూన్‌కు బయలుదేరండి" : "Start heading over now to keep your spot")) + '</span>' +

      '<div class="row">' +

// PWA Live Notifications & Mobile Install State
var pwaNotifDismissed = false;
var deferredInstallPrompt = null;

if (typeof window !== "undefined" && window.addEventListener) {

}

function renderPWANotificationBanner() {
  try {
    if (localStorage.getItem("sf_pwa_seen") === "1" || localStorage.getItem("sf_pwa_dismissed") === "1") {
      return "";
    }
  } catch (e) {}

  if (typeof window === "undefined" || !("Notification" in window)) return "";
  if (Notification.permission === "granted") return "";

  // Mark seen immediately so once seen, it is gone for lifetime!
  try {
    localStorage.setItem("sf_pwa_seen", "1");
  } catch (e) {}

  return '<div class="pwa-notif-card" id="pwa-notif-card">' +
    '<div class="pwa-notif-left">' +
      '<div class="pwa-notif-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>' +

function renderPWAInstallBanner() {

// 1. Home View
function home() {
  var app = document.getElementById("app");
  if (!app) return;

  var l = S.slice();

  if (sort === "Shortest wait") l.sort(function(a, b) { return a.w - b.w; });
  if (sort === "Nearest") l.sort(function(a, b) { return a.d - b.d; });
  if (sort === "Top rated") l.sort(function(a, b) { return b.r - a.r; });

  var qInput = document.getElementById("q");
  var q = qInput ? qInput.value : "";
  var qLower = q.toLowerCase().trim();

  if (qLower) {
    l = l.filter(function(s) {
      var servicesText = s.s.map(function(v) { return v[0]; }).join(" ").toLowerCase();
      var fullText = (s.n + " " + s.a + " " + s.addr + " " + servicesText).toLowerCase();

    '<div class="stat-box"><div class="sn num holo">184</div><div class="sub">' + t("tokensBooked") + '</div></div>' +

  // Quick Sort & Filters (Emoji-Free)
  h += '<div class="chips-group">' +
    '<div class="chips-label">Quick Sort and Filters</div>' +

      '<button class="chip' + (sort === "Shortest wait" && !onlyLowCrowd && !onlyFavs ? " on" : "") + '" data-sort="Shortest wait">' + t("shortestWait") + '</button>' +
      '<button class="chip' + (sort === "Nearest" ? " on" : "") + '" data-sort="Nearest">' + t("nearest") + '</button>' +
      '<button class="chip' + (sort === "Top rated" ? " on" : "") + '" data-sort="Top rated">' + t("topRated") + '</button>' +
      '<button class="chip' + (onlyLowCrowd ? " on" : "") + '" data-toggle-low="1">' + t("lowCrowdOnly") + '</button>' +

        s.s.map(function(v, i) {

        '<h3 style="margin:28px 0 12px;font-size:20px">Location and Contact</h3>' +

      // Side Live Queue Panel
      '<div class="panel sticky-p">' +
        '<div class="sub live"><i class="dot" style="--c:var(--low);display:inline-block;margin-right:6px"></i>Live Queue Status</div>' +
        '<div class="big num holo" style="margin:10px 0 4px">' + totalWait + ' min</div>' +
        '<div class="sub">' + aheadCount + ' customer' + (aheadCount === 1 ? '' : 's') + ' ahead of you &middot; ~' + readyBy + '</div>' +
        badge(s.w) +
        '<div class="row" style="margin-top:22px">' +
          '<span class="sub">' + (pickedIndices.length || 1) + ' service' + (pickedIndices.length === 1 ? '' : 's') + '</span>' +
          '<b class="num">Rs ' + (pickedPrice || 250) + '</b>' +
        '</div>' +
        '<button class="btn main" style="width:100%;margin-top:14px" data-book="' + id + '">' + t("bookToken") + '</button>' +
      '</div>' +
    '</div>' +

    // Sticky Bottom Bar
    '<div class="sticky">' +
      '<div>' +
        '<div class="num" style="font-weight:700">Rs ' + (pickedPrice || 250) + ' &middot; ~' + totalWait + ' min</div>' +
        '<div class="sub">' + (pickedIndices.length || 1) + ' selected</div>' +
      '</div>' +
      '<button class="btn main" data-book="' + id + '">' + t("bookToken") + '</button>' +
    '</div>';

  app.innerHTML = h;
}

// 3. Active Token View with 3D Flippable Card
function tokenView() {
  var app = document.getElementById("app");
  if (!app) return;

  token = ld(K.t, null);

  if (!token) {
    app.innerHTML = '<div class="empty">' +
      '<h2>No Active Token</h2>' +
      '<p>Select any salon in Visakhapatnam and book a token to generate your pass card.</p>' +
      '<button class="btn main" data-go="home">Browse Salons</button>' +
    '</div>';
    return;
  }

  // 10-Minute Arrival Grace Period Engine
  if (token.pos <= 1 && token.status !== "checked_in" && token.status !== "skipped") {
    if (!token.callTime) {
      token.callTime = Date.now();
      sv(K.t, token);
      sendRealNotification("Your Turn at " + token.salon, "Your token #" + token.no + " is called! Please check in within 10 minutes.");
    }
    var elapsedSec = Math.floor((Date.now() - token.callTime) / 1000);
    var remainingSec = Math.max(0, 600 - elapsedSec);
    token.remainingSec = remainingSec;

    if (remainingSec <= 0 && token.status !== "skipped") {
      token.status = "skipped";
      token.pos = 0;
      sv(K.t, token);
      toast("Token #" + token.no + " expired due to 10-minute no-show policy.");
    }
  }

  var isTurn = token.pos <= 1;
  var isCheckedIn = token.status === "checked_in";
  var isSkipped = token.status === "skipped";

  var timerDisplay = "";
  if (isTurn && !isCheckedIn && !isSkipped) {
    var r = token.remainingSec || 600;
    var m = Math.floor(r / 60);
    var sec = r % 60;
    timerDisplay = (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  var h = '<div style="max-width:540px;margin:20px auto">' +
    '<div class="panel tok" style="padding:24px 20px">' +
      '<div class="sub">' + esc(token.salon) + '</div>' +
      '<div style="font-size:22px;font-weight:800;margin:8px 0">' +
        (isCheckedIn ? 'Checked In and In Service' :
         isSkipped ? 'Token Skipped (No-Show)' :
         isTurn ? t("youAreNext") :
         (t("youArePos") + ' #' + token.pos + ' in queue')) +
      '</div>';

  if (!isCheckedIn && !isSkipped) {
    h += '<div class="sub live"><i class="dot" style="--c:var(--low);display:inline-block;margin-right:6px"></i>Estimated wait: ~' + token.eta + ' ' + t("minWait") + '</div>';
  }

  if (isTurn && !isCheckedIn && !isSkipped) {
    h += '<div style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;border-radius:14px;padding:12px;margin:16px 0;font-size:14px;font-weight:600">' +
      'Arrival Window: <span id="arrival-timer-val">' + timerDisplay + '</span> remaining. Please check in at counter or token will be skipped.' +
    '</div>';
  }

  // 3D Flippable Premium Card
  h += render3DTokenCard(token, 0);

  // Action Buttons
  h += '<div style="display:flex;gap:10px;flex-direction:column;margin-top:18px">';
  if (!isCheckedIn && !isSkipped) {
    h += '<button class="btn main" data-act="qrcheckin">' + t("checkInQR") + ' (Simulate Counter Scan)</button>';
    h += '<button class="btn" data-act="simadvanceturn">Advance Turn in Queue (Test 2-Turn Alert)</button>';
    h += '<button class="btn btn-danger" data-act="simnoshow">Simulate 10-Minute Late (Test No-Show Skip)</button>';
    h += '<div style="display:flex;gap:8px;margin-top:4px">' +
      '<button class="btn btn-sm" style="flex:1" data-act="testnotif">🔔 Test PWA Alert</button>' +
      '<button class="btn btn-sm" style="flex:1" data-act="installpwa">📲 Install PWA</button>' +
    '</div>';
  }
  h += '<button class="btn" data-cancel="1">' + (isSkipped || isCheckedIn ? "Clear Token" : t("cancelToken")) + '</button>';
  h += '</div>' +
    '</div></div>';

  app.innerHTML = h;

  if (noShowTimerInterval) clearInterval(noShowTimerInterval);
  if (isTurn && !isCheckedIn && !isSkipped) {
    noShowTimerInterval = setInterval(function() {
      if (location.hash !== "#token") {
        clearInterval(noShowTimerInterval);
        return;
      }
      var curTok = ld(K.t, null);
      if (!curTok || !curTok.callTime) return;
      var elapsedSec = Math.floor((Date.now() - curTok.callTime) / 1000);
      var remainingSec = Math.max(0, 600 - elapsedSec);
      curTok.remainingSec = remainingSec;
      sv(K.t, curTok);

      var timerEl = document.getElementById("arrival-timer-val");
      if (timerEl) {
        var tm = Math.floor(remainingSec / 60);
        var tsec = remainingSec % 60;
        timerEl.textContent = (tm < 10 ? '0' : '') + tm + ':' + (tsec < 10 ? '0' : '') + tsec;
      }

      if (remainingSec <= 0 && curTok.status !== "skipped") {
        clearInterval(noShowTimerInterval);
        curTok.status = "skipped";
        curTok.pos = 0;
        sv(K.t, curTok);
        toast("Token #" + curTok.no + " expired due to 10-minute no-show policy.");
        tokenView();
      }
    }, 1000);
  }
}

// 4. Central Router
function route() {
  var h = location.hash.slice(1) || "home";

  document.querySelectorAll("[data-go]").forEach(function(a) {
    if (a.tagName === "A") {
      a.classList.toggle("on", a.dataset.go === h);
    }
  });

  var pagesMap = window.PAGES || (typeof PAGES !== "undefined" ? PAGES : null);
  if (pagesMap && pagesMap[h]) {
    pagesMap[h]();
  } else if (h === "token") {
    tokenView();
  } else if (h === "wallet") {
    walletView();
  } else if (h === "admin-queue") {
    adminQueueView();
  } else if (h === "sql-studio") {
    sqlStudioView();
  } else if (h.indexOf("salon-") === 0) {
    detail(h.slice(6));
  } else {
    home();
  }

  window.scrollTo(0, 0);
  authUI();
  renderFooter();
}

// Global Click Handlers
document.addEventListener("click", function(e) {
  var tTarget = e.target.closest("[data-go],[data-open],[data-svc],[data-book],[data-sort],[data-area],[data-cancel],[data-fav],[data-toggle-low],[data-toggle-fav],[data-reset-filters],[data-act]");
  if (!tTarget) return;

  if (e.target.closest("#search-clear")) {
    var qInput = document.getElementById("q");
    if (qInput) {
      qInput.value = "";
      home();
    }
    return;
  }

  var h = location.hash.slice(1);

  if (tTarget.dataset.go) {
    location.hash = tTarget.dataset.go;
  }
  else if (tTarget.dataset.open) {
    location.hash = "salon-" + tTarget.dataset.open;
  }
  else if (tTarget.dataset.fav) {
    e.stopPropagation();
    toggleFav(tTarget.dataset.fav);
  }
  else if (tTarget.dataset.sort) {
    sort = tTarget.dataset.sort;
    onlyLowCrowd = false;
    home();
  }
  else if (tTarget.dataset.area) {
    area = tTarget.dataset.area;
    home();
  }
  else if (tTarget.dataset.toggleLow) {
    onlyLowCrowd = !onlyLowCrowd;
    home();
  }
  else if (tTarget.dataset.toggleFav) {
    onlyFavs = !onlyFavs;
    home();
  }
  else if (tTarget.dataset.resetFilters) {
    sort = "Shortest wait";
    area = "All";
    onlyLowCrowd = false;
    onlyFavs = false;
    var qIn = document.getElementById("q");
    if (qIn) qIn.value = "";
    home();
  }
  else if (tTarget.dataset.svc) {
    var id = h.slice(6);
    sel[id][tTarget.dataset.svc] = !sel[id][tTarget.dataset.svc];
    var y = window.scrollY;
    detail(id);
    window.scrollTo(0, y);
  }
  else if (tTarget.dataset.book) {
    if (!me()) {
      goLogin("Please log in to book a queue token");
      return;
    }
    var s = S.filter(function(x) { return x.id == tTarget.dataset.book; })[0];
    var p = Math.max(1, Math.round(s.w / 8));
    var tokNo = 40 + Math.floor(Math.random() * 40);
    token = {
      id: "SF-2026-" + Math.floor(1000 + Math.random() * 9000),
      salonId: s.id,
      salon: s.n,
      area: s.a,
      addr: s.addr,
      no: tokNo,
      pos: p,
      eta: s.w,
      status: "waiting",
      services: ["Executive Haircut and Styling"],
      price: 250,
      date: "Today, " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      qrHash: "sf-tok-" + tokNo + "-" + s.id + "-live",
      created: Date.now()
    };
    sv(K.t, token);
    saveWalletToken(token);
    sendRealNotification("Token #" + token.no + " Confirmed!", "You are in line at " + token.salon + " (Pos #" + token.pos + ", ~" + token.eta + " min wait).");
    toast("Token #" + token.no + " booked and saved to your Pass Wallet!");
    location.hash = "token";
  }
  else if (tTarget.dataset.cancel) {
    token = null;
    sv(K.t, null);
    toast("Token cancelled");
    tokenView();
  }
  else if (tTarget.dataset.act === "qrcheckin") {
    if (token) {
      token.status = "checked_in";
      token.pos = 0;
      sv(K.t, token);
      toast("Check-in verified via QR! You are now in service.");
      tokenView();
    }
  }
  else if (tTarget.dataset.act === "simadvanceturn") {
    if (token && token.pos > 1) {
      token.pos--;
      token.eta = Math.max(5, token.eta - 10);
      sv(K.t, token);
      if (token.pos === 2) {
        toast("Departure Alert: You are now 2 turns away at " + token.salon + "!");
        sendRealNotification("Departure Alert", "You are 2 turns away at " + token.salon + "! Start heading over now.");
      }
      tokenView();
    } else if (token && token.pos === 1) {
      toast("You are turn #1! Arrival countdown is active.");
    }
  }
  else if (tTarget.dataset.act === "simnoshow") {
    if (token) {
      token.status = "skipped";
      token.pos = 0;
      sv(K.t, token);
      toast("10-minute arrival window expired. Token marked as no-show.");
      tokenView();
    }
  }
  else if (tTarget.dataset.act === "lb") {
    var sid = +tTarget.dataset.id;
    var sObj = S.filter(function(x) { return x.id === sid; })[0];
    if (sObj) openLb(sObj, +tTarget.dataset.idx || 0);
  }
  else if (tTarget.dataset.act === "lbc") {
    closeLb();
  }
  else if (tTarget.dataset.act === "lbp") {
    nextLb(-1);
  }
  else if (tTarget.dataset.act === "lbnx") {
    nextLb(1);
  }
  else if (tTarget.dataset.act === "enablenotif") {
    try {
      localStorage.setItem("sf_pwa_seen", "1");
      localStorage.setItem("sf_pwa_dismissed", "1");
    } catch (e) {}
    requestNotificationPermission(function(granted) {
      var el = document.getElementById("pwa-notif-card");
      if (el) el.remove();
    });
  }
  else if (tTarget.dataset.act === "dismissnotif") {
    try {
      localStorage.setItem("sf_pwa_seen", "1");
      localStorage.setItem("sf_pwa_dismissed", "1");
    } catch (e) {}
    var el = document.getElementById("pwa-notif-card");
    if (el) el.remove();
  }
  else if (tTarget.dataset.act === "flipcard" || e.target.closest(".token-card-3d") || e.target.closest("[data-act='flipcard']")) {
    var cardEl = e.target.closest(".token-card-3d");
    if (cardEl) {
      cardEl.classList.toggle("flipped");
    }
  }
  else if (tTarget.dataset.act === "testnotif") {
    sendRealNotification("SalonFlow PWA Live Alert", "Live Queue Alert: You are 2 turns away at Toni and Guy Unisex Salon (~14 min wait).");
    toast("Test PWA notification sent to your device!");
  }
  else if (tTarget.dataset.act === "installpwa") {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(choice) {
        if (choice.outcome === "accepted") {
          toast("SalonFlow PWA installed successfully!");
        }
        deferredInstallPrompt = null;
      });
    } else {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        toast("To install on iPhone: Tap the Share button at bottom and tap 'Add to Home Screen'");
      } else {
        toast("To install: Open browser menu (⋮) > tap 'Install app' or 'Add to Home screen'");
      }
    }
  }
});

// Shortcut key '/' and Lightbox keyboard navigation
document.addEventListener("keydown", function(e) {
  if (lbs) {
    if (e.key === "Escape") {
      closeLb();
      return;
    }
    if (e.key === "ArrowLeft") {
      nextLb(-1);
      return;
    }
    if (e.key === "ArrowRight") {
      nextLb(1);
      return;
    }
  }

  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
    var qEl = document.getElementById("q");
    if (qEl) {
      e.preventDefault();
      qEl.focus();
    }
  }
  if (e.key === "Enter" && e.target.matches(".card, .svc")) {
    e.target.click();
  }
});

var logoEl = document.getElementById("logo");
if (logoEl) {
  logoEl.onclick = function() { location.hash = "home"; };
}

var langToggleEl = document.getElementById("lang-toggle");
if (langToggleEl) {
  langToggleEl.onclick = function() {
    setLang(currentLang === "en" ? "te" : "en");
  };
}

// Register PWA Service Worker
if (typeof navigator !== "undefined" && "serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./sw.js").catch(function() {});
  });
}

window.addEventListener("hashchange", route);
route();

</script>
